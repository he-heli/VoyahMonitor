services:
  voyah-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyah-monitor
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["voyah-monitor", "bot"]

  # Dev only — on VPS use local scripts/local-login.sh + scp session.json
  voyah-login:
    build:
      context: .
      dockerfile: Dockerfile.login
    container_name: voyah-monitor-login
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    command: ["voyah-monitor", "login"]
    profiles:
      - login

  voyah-fetch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyah-monitor-fetch
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["voyah-monitor", "fetch"]
    profiles:
      - fetch
