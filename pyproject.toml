[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyah-monitor"
version = "0.1.0"
description = "Read-only VOYAH Assist telemetry collector and Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
login = ["playwright>=1.48"]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.48"]

[project.scripts]
voyah-monitor = "voyah_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
